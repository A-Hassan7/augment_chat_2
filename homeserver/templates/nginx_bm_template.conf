# Docker DNS resolver
resolver 127.0.0.11 valid=30s;

# Upstream for Bridge Manager instances (stateless — round-robin)
upstream bridge_manager_backend {
{{UPSTREAM_SERVERS}}

    keepalive 32;
}

# Health / metrics endpoint (internal)
server {
    listen {{NGINX_STATUS_PORT}};
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
    }
}

# Bridge Manager proxy — Synapse and bridges connect here
server {
    listen {{NGINX_HTTP_PORT}};

    client_max_body_size {{CLIENT_MAX_BODY_SIZE}};
    client_body_buffer_size 128k;

    access_log /var/log/nginx/bridge_manager_access.log;
    error_log /var/log/nginx/bridge_manager_error.log;

    # Forward all requests to a bridge manager instance
    location / {
        proxy_pass http://bridge_manager_backend;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Timeouts (long-polling friendly)
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # HTTP/1.1 keep-alive (required for upstream keepalive)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check — returns 200 if any instance is up
    location /health {
        access_log off;
        proxy_pass http://bridge_manager_backend/health;
    }
}
