# Docker DNS resolver
resolver 127.0.0.11 valid=30s;

# Upstream for Synapse (main or workers)
upstream synapse_backend {
    # Use consistent hashing for sticky sessions
    hash $remote_addr consistent;
    
{{UPSTREAM_SERVERS}}
    
    # Health checks and load balancing
    keepalive 32;
}

# Health check endpoint for monitoring
server {
    listen {{NGINX_STATUS_PORT}};
    server_name _;
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /nginx_status {
        stub_status on;
        access_log off;
    }
}

# Main proxy server
server {
    listen {{NGINX_HTTP_PORT}};
    server_name {{DOMAIN}};
    
    # Increase buffer sizes for large requests
    client_max_body_size {{CLIENT_MAX_BODY_SIZE}};
    client_body_buffer_size 128k;
    
    # Logging
    access_log /var/log/nginx/synapse_access.log;
    error_log /var/log/nginx/synapse_error.log;
    
    # Matrix client API
    location /_matrix {
        proxy_pass http://synapse_backend;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        
        # Timeouts
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Federation API
    location /_synapse {
        proxy_pass http://synapse_backend;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://synapse_backend/_matrix/client/versions;
    }
}
